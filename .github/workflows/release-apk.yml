name: Release APK

# Si avvia quando viene pubblicato un tag di versione (es. v1.4.0).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # necessario per creare la GitHub Release

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17' # coerente con android/app/build.gradle (JavaVersion 17)

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7' # allineata alla versione locale (bundla intl 0.20.x)
          channel: stable
          cache: true

      - name: Crea .env dai secret
        run: |
          cat > .env <<EOF
          QUALTRICS_URL=${{ secrets.QUALTRICS_URL }}
          QUALTRICS_TOKEN=${{ secrets.QUALTRICS_TOKEN }}
          VAPID_KEY=${{ secrets.VAPID_KEY }}
          GITHUB_REPO_OWNER=${{ github.repository_owner }}
          GITHUB_REPO_NAME=${{ github.event.repository.name }}
          GITHUB_API_TOKEN=${{ secrets.FEEDBACK_GITHUB_TOKEN }}
          ADMIN_DEBUG_PASSWORD=${{ secrets.ADMIN_DEBUG_PASSWORD }}
          EOF

      - name: Decodifica keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks

      - name: Crea key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Installa dipendenze
        run: flutter pub get

      - name: Build APK di release
        run: flutter build apk --release

      - name: Crea GitHub Release con APK
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
